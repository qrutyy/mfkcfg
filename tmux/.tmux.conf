# --- Глобальные настройки ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 1000000

# Основной префикс (пусть будет Ctrl+a на всякий случай)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Интеграция с системным буфером macOS
set -s set-clipboard on

# Настройка копирования как в Vim (v - начать выделение, y - копировать)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Бинды БЕЗ ПРЕФИКСА (-n) через Alt (M) ---
# Навигация (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Управление окнами и сплитами (как в iTerm)
bind -n M-d split-window -h -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-s choose-tree -Zs

# Переключение вкладок (Alt + 1,2,3...)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Дизайн (минимализм)
set -g status-position bottom
set -g status-style bg='#e0e0e0',fg='#333333'
set -g status-left "#[fg=blue,bold] #S #[fg=black,nobold]| "
set -g status-right ""
set -g window-status-current-format "#[fg=white,bg=blue,bold] #I:#W #[default]"

# Плагины
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
